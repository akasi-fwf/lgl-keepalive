name: LGL keep-alive

# Keeps the Live Global Lens backend (livegloballens.com) awake 24/7 so live news,
# opportunities, alerts and other scheduled jobs never stop.
# Each run pings every 2 minutes for about 28 minutes (time-boxed, so a slow server can
# never make the job overrun), then queues the next run itself. The schedule is a backup.
# It also starts the health monitor (health.yml) twice per run, about every 15 minutes.

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

concurrency:
  group: lgl-keepalive
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Ping Live Global Lens every 2 minutes for ~28 minutes
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          start=$(date +%s); i=0
          while [ $(( $(date +%s) - start )) -lt 1680 ]; do
            i=$((i+1))
            if [ "$i" = "1" ] || [ "$i" = "8" ]; then
              gh workflow run health.yml --ref main --repo "${{ github.repository }}" || echo "health check could not be started"
            fi
            for url in "https://vc844429812320.coderick.net/api/lgl/health/cron" "https://livegloballens.com/"; do
              code=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 10 --max-time 20 -A "LiveGlobalLens-keepalive" "$url" || echo 000)
              echo "$(date -u +%FT%TZ) $url -> $code"
            done
            sleep 120
          done

      - name: Check out repository
        if: always()
        continue-on-error: true
        uses: actions/checkout@v4

      - name: Daily heartbeat commit (keeps the scheduled workflow enabled)
        if: always()
        continue-on-error: true
        run: |
          if [ "$(date -u +%H)" = "00" ]; then
            date -u +%FT%TZ > heartbeat.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add heartbeat.txt
            git commit -m "Heartbeat $(date -u +%F)" || exit 0
            for n in 1 2 3; do git pull --rebase --autostash origin main && git push && break; sleep 5; done || true
          fi

      - name: Start the next run (self-chaining, so pings never stop)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run keepalive.yml --ref main --repo "${{ github.repository }}" || echo "next run could not be queued; the schedule will start one"
